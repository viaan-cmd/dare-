<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer LAN Truth or Dare</title>
    <!-- PeerJS CDN for direct device-to-device connection over local network / internet -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #818cf8;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hidden {
            display: none !important;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-truth { background-color: #0284c7; }
        .btn-truth:hover { background-color: #0369a1; }
        .btn-dare { background-color: #db2777; }
        .btn-dare:hover { background-color: #be185d; }
        .btn-choice { background-color: #10b981; }
        .btn-choice:hover { background-color: #059669; }

        .card {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 20px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .current-player {
            font-size: 1.15rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .prompt-text {
            font-size: 1rem;
            line-height: 1.4;
            color: #f1f5f9;
        }

        .status-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #38bdf8;
            border: 1px dashed #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LAN Truth or Dare</h1>
    <div class="subtitle">Multi-Device Synchronized Edition</div>

    <!-- LOBBY SCREEN -->
    <div id="lobbyScreen" class="screen">
        <p style="color: var(--text-muted); margin:0;">Select your player profile to join:</p>
        <select id="playerNameSelect">
            <option value="Viaan">Viaan (Male)</option>
            <option value="Mohammad">Mohammad (Male)</option>
            <option value="Sarrah">Sarrah (Female)</option>
            <option value="Nikki">Nikki (Female)</option>
        </select>

        <button class="btn" onclick="hostGame()">Create Room (Host)</button>
        <div style="font-size: 0.85rem; color: var(--text-muted);">— OR JOIN EXISTING ROOM —</div>
