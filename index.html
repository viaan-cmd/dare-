<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth, Dare & Choices</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #818cf8;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hidden {
            display: none !important;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-truth { background-color: #0284c7; }
        .btn-truth:hover { background-color: #0369a1; }
        .btn-dare { background-color: #db2777; }
        .btn-dare:hover { background-color: #be185d; }
        .btn-choice { background-color: #10b981; }
        .btn-choice:hover { background-color: #059669; }

        .card {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .current-player {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .prompt-text {
            font-size: 1.05rem;
            line-height: 1.4;
            color: #f1f5f9;
        }

        .player-chips {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .chip {
            background: #334155;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Truth, Dare & Choices</h1>
    <div class="subtitle">Sitting / Couch Edition</div>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="screen">
        <p style="color: var(--text-muted); margin:0;">Players locked in:</p>
        <div class="player-chips">
            <span class="chip">Viaan</span>
            <span class="chip">Sarrah</span>
            <span class="chip">Mohammad</span>
            <span class="chip">Nikki</span>
        </div>
        <button id="startBtn" class="btn">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen hidden">
        <div id="turnIndicator" class="current-player">It's Viaan's turn!</div>
        
        <div class="card">
            <div id="promptContent" class="prompt-text">Choose Truth, Dare, or Choose Between below!</div>
        </div>

        <div id="choiceButtons" class="btn-group">
            <button id="truthBtn" class="btn btn-truth">Truth</button>
            <button id="dareBtn" class="btn btn-dare">Dare</button>
            <button id="choiceBtn" class="btn btn-choice">Choice</button>
        </div>

        <button id="nextBtn" class="btn hidden" style="background-color: #334155;">Next Player</button>
    </div>
</div>

<script>
    const players = [
        { name: "Viaan", gender: "male" },
        { name: "Mohammad", gender: "male" },
        { name: "Sarrah", gender: "female" },
        { name: "Nikki", gender: "female" }
    ];

    let currentPlayerIndex = 0;

    const truths = {
        male: [
            "Who in this room would you trust the most to hide your phone if it had embarrassing things on it?",
            "What is the funniest text you've accidentally sent to the wrong person while sitting at home?",
            "If you had to swap styles with someone in this room for a week, who would it be?",
            "What is a silly secret talent you can perform right now while sitting down?"
        ],
        female: [
            "Who in this room do you think takes the longest to get ready when going out?",
            "What is the weirdest snack combination you actually enjoy eating while gaming or chilling?",
            "If you could instantly teleport anywhere in the world right now without leaving your seat, where would you go?",
            "What's a minor habit you have that you think nobody else notices?"
        ]
    };

    const dares = {
        male: [
            "Send a random emoji to the last person you messaged on your phone without explaining why.",
            "Do your best dramatic movie villain monologue for 15 seconds while remaining completely seated.",
            "Let the person to your right look through your photo gallery for 30 seconds.",
            "Speak like a robot for the next 2 full rounds while answering questions."
        ],
        female: [
            "Speak in a dramatic British accent for the next 2 full rounds.",
            "Act out your reaction if your phone suddenly flew across the room right now.",
            "Send a voice note to a random friend saying 'The penguins are migrating early this year' and play it out loud.",
            "Let the person to your left change your phone wallpaper to something funny for 10 minutes."
        ]
    };

    const choices = {
        male: [
            "**Would You Rather:** Between Sarrah and Nikki, who would you rather kiss? (Pick one boldly!)",
            "**Would You Rather:** Between Sarrah and Nikki, who would you trust to survive a zombie apocalypse locked in a room together?",
            "**Would You Rather:** Between Sarrah and Nikki, who has the better taste in music or games?"
        ],
        female: [
            "**Would You Rather:** Between Viaan and Mohammad, who would you rather kiss? (No backing out, pick one!)",
            "**Would You Rather:** Between Viaan and Mohammad, who do you think would panic first if the Wi-Fi cut out?",
            "**Would You Rather:** Between Viaan and Mohammad, who would you pick as your co-driver on a cross-country road trip?"
        ]
    };

    // DOM Elements
    const setupScreen = document.getElementById('setupScreen');
    const gameScreen = document.getElementById('gameScreen');
    const startBtn = document.getElementById('startBtn');
    const turnIndicator = document.getElementById('turnIndicator');
    const promptContent = document.getElementById('promptContent');
    const choiceButtons = document.getElementById('choiceButtons');
    const truthBtn = document.getElementById('truthBtn');
    const dareBtn = document.getElementById('dareBtn');
    const choiceBtn = document.getElementById('choiceBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Event Listeners (Guaranteed to bind properly)
    startBtn.addEventListener('click', () => {
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        updateTurnDisplay();
    });

    truthBtn.addEventListener('click', () => getPrompt('truth'));
    dareBtn.addEventListener('click', () => getPrompt('dare'));
    choiceBtn.addEventListener('click', () => getPrompt('choice'));

    nextBtn.addEventListener('click', () => {
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        updateTurnDisplay();
    });

    function updateTurnDisplay() {
        const p = players[currentPlayerIndex];
        turnIndicator.textContent = `It's ${p.name}'s turn!`;
        promptContent.innerHTML = "Choose Truth, Dare, or Choose Between below!";
        choiceButtons.classList.remove('hidden');
        nextBtn.classList.add('hidden');
    }

    function getPrompt(type) {
        const p = players[currentPlayerIndex];
        let pool;
        let titleName = type.toUpperCase();

        if (type === 'truth') pool = truths[p.gender];
        else if (type === 'dare') pool = dares[p.gender];
        else {
            pool = choices[p.gender];
            titleName = "CHOOSE BETWEEN";
        }

        const randomItem = pool[Math.floor(Math.random() * pool.length)];

        promptContent.innerHTML = `<strong>${p.name} (${titleName}):</strong><br><br>${randomItem}`;
        choiceButtons.classList.add('hidden');
        nextBtn.classList.remove('hidden');
    }
</script>

</body>
</html>
